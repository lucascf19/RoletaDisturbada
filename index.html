<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roleta Colorida — Evento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <header class="topbar">
      <div class="brand">
        <h1>Gire e Ganhe da Disturbance</h1>
        <p class="subtitle">Digite seu nome e gire — apenas uma chance por dispositivo</p>
      </div>
      
    </header>

    <section class="center">
      <div class="left-panel">
        <label for="nameInput">Seu nome:</label>
        <input id="nameInput" type="text" placeholder="Digite seu nome aqui" autocomplete="off" />
        <div class="note">Anti-repetição: habilitado (por dispositivo)</div>
        <button id="spinBtn" class="spin">GIRAR</button>
      </div>

      <div class="wheel-area">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="700" height="700"></canvas>
      </div>
    </section>

    <footer class="footer">
      <div id="lastResult">Resultado: —</div>
    </footer>
  </main>

  <!-- Modal de prêmio -->
  <div id="prizeModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button id="closeModal" class="close">✕</button>
      <div class="modal-body">
        <h2 class="modal-title">Parabéns, <span id="winnerName">—</span>!</h2>
        <div class="prize-glow">
          <div class="prize-text" id="prizeText">—</div>
        </div>
        <p class="modal-sub">Seu prêmio foi registrado com sucesso.</p>
        <button id="modalOk" class="primary">Fechar</button>
      </div>
      <canvas id="confettiCanvas" class="confetti"></canvas>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
